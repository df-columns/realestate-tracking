/* ══ CSV 내려받기 ═══════════════════════════════════════════ */
function downloadCsv(){
  var yms = rangeYms(), series = selectedSeries(yms);
  if(!series.length){ alert("먼저 단지를 선택하세요."); return; }
  var lines = [["월"].concat(series.map(function(s){ return s.name; })).join(",")];
  yms.forEach(function(ym){
    var row = [ymLabel(ym)], any = false;
    series.forEach(function(s){
      var p = s.map[ym]; if(p) any = true;
      row.push(p ? Math.round(p.v*10)/10 : "");
    });
    if(any) lines.push(row.join(","));
  });
  var blob = new Blob(["﻿" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "실거래가_" + S.area + "_" +
    (S.metric === "ratio" ? "전세가율" : typeLabel() + "_" + S.metric) + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ══ 선택 패널 ═══════════════════════════════════════════════ */
function assignSlot(id){
  var used = {};
  for(var k in S.slot) used[S.slot[k]] = 1;
  for(var i=0;i<MAX_SEL;i++) if(!used[i]){ S.slot[id] = i; return true; }
  return false;
}
function addToCompare(id){
  if(S.sel.indexOf(id) < 0){
    if(S.sel.length >= MAX_SEL){
      alert("한 번에 최대 " + MAX_SEL + "개까지 비교할 수 있습니다.");
      return;
    }
    assignSlot(id); S.sel.push(id);
  }
  renderPicker();
  if(S.tab === "map") renderMap();      // 지도에서는 화면을 지키고 선택만 표시
  else setTab("compare");
}
function toggleSel(id){
  var i = S.sel.indexOf(id);
  if(i >= 0){ S.sel.splice(i,1); delete S.slot[id]; }   // 색 슬롯 반납 — 남은 단지 색은 유지
  else {
    if(S.sel.length >= MAX_SEL){
      alert("한 번에 최대 " + MAX_SEL + "개까지 비교할 수 있습니다. 색으로 구분 가능한 한계입니다.");
      renderPicker(); return;
    }
    assignSlot(id); S.sel.push(id);
  }
  renderPicker();
  render();                     // 지도에서 눌러도 지도만 다시 그려진다(탭 유지)
}
function renderPicker(){
  var host = document.getElementById("pickList");
  var q = (document.getElementById("pickSearch").value || "").trim().toLowerCase();
  host.textContent = "";
  var gs = HAS_TIER
    ? TIERS.map(function(t){
        return {name: t + "급지", members: C.filter(function(c){ return c.tier === t; })}; })
        .concat([{name:"급지 미지정", members: C.filter(function(c){ return c.tier == null; })}])
    : META.regions.map(function(r){
        return {name: r, members: C.filter(function(c){ return c.region === r; })}; });
  gs.forEach(function(g){
    var members = g.members.filter(function(c){
      if(!q) return true;
      return (c.name + " " + sggLabel(c) + " " + c.dong + " " +
              (c.area_name||"") + " " + c.region).toLowerCase().indexOf(q) >= 0;
    });
    if(!members.length) return;
    host.appendChild(el("div","pgrp", g.name));
    members.forEach(function(c){
      var rep = repArea(c, S.area);
      var lab = el("label","pitem" + (rep ? "" : " off"));
      var cb = el("input"); cb.type = "checkbox";
      cb.checked = S.sel.indexOf(c.id) >= 0;
      cb.addEventListener("change", function(){ toggleSel(c.id); });
      lab.appendChild(cb);
      var dot = el("span","dot");
      dot.style.background = cb.checked ? colorOf(c.id) : "transparent";
      dot.style.border = cb.checked ? "0" : "1px solid var(--axis)";
      lab.appendChild(dot);
      lab.appendChild(el("span","nm", c.name));
      lab.appendChild(el("span","ar", rep ? rep.toFixed(1)+"㎡" : "—"));
      lab.title = sggLabel(c) + " " + c.dong +
                  (rep ? "" : " · 전용 " + S.area + "㎡ 거래 없음");
      host.appendChild(lab);
    });
  });
  document.getElementById("pickCount").textContent = S.sel.length + " / " + MAX_SEL + " 선택";
}

/* ══ 컨트롤 ══════════════════════════════════════════════════ */
function seg(hostId, items, get, set){
  var host = document.getElementById(hostId);
  if(!host) return;
  host.textContent = "";
  items.forEach(function(it){
    var b = el("button", null, it.label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(get() === it.v));
    b.addEventListener("click", function(){ set(it.v); });
    host.appendChild(b);
  });
}
function chipRow(hostId, items, isOn, toggle){
  var host = document.getElementById(hostId);
  if(!host) return;
  host.textContent = "";
  items.forEach(function(it){
    var b = el("button","chip", String(it.label));
    b.type = "button";
    b.setAttribute("aria-pressed", String(isOn(it.v)));
    b.addEventListener("click", function(){ toggle(it.v); });
    host.appendChild(b);
  });
}
var PERIOD_OPTS = [1,3,6,12,24,36,60,120];
function buildControls(){
  chipRow("chipYears", yearChipDefs(),
    function(v){ return S.rangeKey === v; },
    function(v){ applyRangeKey(v); syncYmInputs(); refresh(); });
  chipRow("chipSpans", SPAN_DEFS,
    function(v){ return S.rangeKey === v; },
    function(v){ applyRangeKey(v); syncYmInputs(); refresh(); });
  seg("segGran",
    [{v:"m",label:"월"},{v:"q",label:"분기"},{v:"y",label:"연"}],
    function(){ return S.gran; }, function(v){ S.gran = v; refresh(); });
  seg("segSmooth",
    [{v:0,label:"원값"},{v:3,label:"3개월"},{v:6,label:"6개월"},{v:12,label:"12개월"}],
    function(){ return S.smoothWin; },
    function(v){ S.smoothWin = v; S.smooth = (v > 0); refresh(); });
  seg("segMapVal", MAP_VALS.map(function(x){ return {v:x.v, label:x.l}; }),
    function(){ return S.mapVal; }, function(v){ S.mapVal = v; refresh(); });
  seg("segNewWin",
    [{v:1,label:"1개월"},{v:2,label:"2개월"},{v:3,label:"3개월"}],
    function(){ return S.newWin; }, function(v){ S.newWin = v; refresh(); });
  seg("segNewType", [{v:"trade",label:"매매"},{v:"rent",label:"전세"}],
    function(){ return S.newType; }, function(v){ S.newType = v; refresh(); });
  seg("segNewSort",
    [{v:"date",label:"최신순"},{v:"price",label:"가격순"},{v:"delta",label:"변동률순"}],
    function(){ return S.newSort; }, function(v){ S.newSort = v; refresh(); });
  seg("segSrc2", [{v:"all",label:"삼토시50+급지대표"},{v:"list",label:"삼토시50"}],
    function(){ return S.srcFilter; }, function(v){ S.srcFilter = v; refresh(); });
  seg("segArea", [{v:"59",label:"59㎡"},{v:"84",label:"84㎡"}],
    function(){ return S.area; },
    function(v){ S.area = v; renderPicker(); refresh(); });
  chipRow("periodChips", PERIOD_OPTS.map(function(p){ return {v:p, label:periodLabel(p)}; }),
    function(v){ return S.periods.indexOf(v) >= 0; },
    function(v){
      var i = S.periods.indexOf(v);
      if(i >= 0) S.periods.splice(i,1); else S.periods.push(v);
      S.periods.sort(function(a,b){return a-b;});
      if(S.sortKey.charAt(0) === "p" &&
         S.periods.indexOf(parseInt(S.sortKey.slice(1),10)) < 0){
        S.sortKey = "tier"; S.sortDir = 1;
      }
      refresh();
    });
  chipRow("tierFilterChips", TIERS.map(function(t){ return {v:t, label:t}; }),
    function(v){ return S.tierFilter.indexOf(v) >= 0; },
    function(v){
      var i = S.tierFilter.indexOf(v);
      if(i >= 0) S.tierFilter.splice(i,1); else S.tierFilter.push(v);
      refresh();
    });
  seg("segSrc", [{v:"all",label:"삼토시50+급지대표"},{v:"list",label:"삼토시50"}],
    function(){ return S.srcFilter; }, function(v){ S.srcFilter = v; refresh(); });
  seg("segCmpMode",
    [{v:"all",label:"3종 함께"},{v:"one",label:"선택 지표만"}],
    function(){ return S.cmpMode; }, function(v){ S.cmpMode = v; refresh(); });
  seg("segGroup", [{v:"tier",label:"급지"},{v:"region",label:"권역"}],
    function(){ return S.groupBy; }, function(v){ S.groupBy = v; refresh(); });
  chipRow("tierPickChips", TIERS.map(function(t){ return {v:t, label:t}; }),
    function(v){ return S.tierPick.indexOf(v) >= 0; },
    function(v){
      var i = S.tierPick.indexOf(v);
      if(i >= 0) S.tierPick.splice(i,1);
      else {
        if(S.tierPick.length >= 8){
          alert("한 번에 최대 8개 급지까지 비교할 수 있습니다. 색으로 구분 가능한 한계입니다.");
          return;
        }
        S.tierPick.push(v);
      }
      refresh();
    });
  var metricItems = [{v:"price",label:"실거래가"},{v:"pyeong",label:"평당가"},
                     {v:"index",label:"지수(=100)"},{v:"ratio",label:"전세가율"}];
  var typeItems = [{v:"trade",label:"매매"},{v:"rent",label:"전세"}];
  ["segMetric","segMetric2"].forEach(function(id){
    seg(id, metricItems, function(){ return S.metric; },
        function(v){ S.metric = v; refresh(); });
  });
  ["segType","segType2"].forEach(function(id){
    seg(id, typeItems, function(){ return S.type; },
        function(v){ S.type = v; refresh(); });
  });
  var dis = (S.metric === "ratio");     // 전세가율은 매매·전세를 함께 쓴다
  ["segType","segType2"].forEach(function(id){
    var bs = document.getElementById(id).querySelectorAll("button");
    for(var i=0;i<bs.length;i++) bs[i].disabled = dis;
  });
  document.getElementById("tierPickWrap").hidden = (S.groupBy !== "tier");
  buildBaseSelect();
  buildBaseGroupSelect();
}
/** 갭·비율의 기준 그룹 드롭다운 */
function buildBaseGroupSelect(){
  var sel = document.getElementById("baseGroupSel");
  if(!sel) return;
  sel.textContent = "";
  var opts = (S.groupBy === "tier")
    ? TIERS.map(function(t){ return {v: t, l: t + "급지"}; })
    : META.regions.map(function(r){ return {v: r, l: r}; });
  opts.forEach(function(o){
    var e = el("option", null, o.l);
    e.value = String(o.v);
    sel.appendChild(e);
  });
  sel.value = String(baseGroupKey());
  sel.onchange = function(){
    if(S.groupBy === "tier") S.baseTier = parseInt(sel.value, 10);
    else S.baseRegion = sel.value;
    render();
  };
}

/** 기준 단지 드롭다운 — 선택된 단지만 후보로 둔다. */
function buildBaseSelect(){
  var sel = document.getElementById("baseSel");
  if(!sel) return;
  if(S.baseId && S.sel.indexOf(S.baseId) < 0) S.baseId = null;
  sel.textContent = "";
  var none = el("option", null, "없음 (절대가격)");
  none.value = "";
  sel.appendChild(none);
  S.sel.forEach(function(id){
    var c = byId(id); if(!c) return;
    var o = el("option", null, c.name);
    o.value = id;
    sel.appendChild(o);
  });
  sel.value = S.baseId || "";
  sel.onchange = function(){
    S.baseId = sel.value || null;
    render();
  };
}
/* 기간 직접 지정 — 연/월 드롭다운.
   해당 연도에 데이터가 있는 달만 보여주므로 범위를 벗어난 값을 고를 수 없다. */
function fillSel(sel, items, val){
  sel.textContent = "";
  items.forEach(function(it){
    var o = el("option", null, it.label);
    o.value = String(it.v);
    sel.appendChild(o);
  });
  sel.value = String(val);
  if(sel.selectedIndex < 0) sel.selectedIndex = 0;
}
function yearOpts(){
  var out = [];
  for(var y = Math.floor(dataStart()/100); y <= Math.floor(dataEnd()/100); y++)
    out.push({v: y, label: y + "년"});
  return out;
}
function monthOpts(year){
  var lo = dataStart(), hi = dataEnd(), out = [];
  for(var m = 1; m <= 12; m++){
    var ym = year * 100 + m;
    if(ym >= lo && ym <= hi) out.push({v: m, label: m + "월"});
  }
  return out;
}
function clampYm(ym){
  return Math.min(dataEnd(), Math.max(dataStart(), ym));
}
function syncYmInputs(){
  var yms = rangeYms();
  var s = yms[0], e = yms[yms.length-1], ys = yearOpts();
  fillSel(document.getElementById("startY"), ys, Math.floor(s/100));
  fillSel(document.getElementById("startM"), monthOpts(Math.floor(s/100)), s % 100);
  fillSel(document.getElementById("endY"), ys, Math.floor(e/100));
  fillSel(document.getElementById("endM"), monthOpts(Math.floor(e/100)), e % 100);
}
function readYmSels(){
  function n(id){ return parseInt(document.getElementById(id).value, 10); }
  var a = n("startY") * 100 + n("startM"), b = n("endY") * 100 + n("endM");
  if(!isFinite(a) || !isFinite(b)) return null;
  a = clampYm(a); b = clampYm(b);
  return (a > b) ? [b, a] : [a, b];
}

/* ══ 탭 ══════════════════════════════════════════════════════ */
function setTab(name){
  S.tab = name;
  var tabs = document.querySelectorAll(".tabs button");
  for(var i=0;i<tabs.length;i++)
    tabs[i].setAttribute("aria-selected", String(tabs[i].dataset.tab === name));
  ["map","new","region","compare","table"].forEach(function(t){
    document.getElementById("tab-" + t).hidden = (t !== name);
  });
  render();
}
function render(){
  if(S.tab === "map") renderMap();
  else if(S.tab === "new") renderNew();
  else if(S.tab === "region") renderRegion();
  else if(S.tab === "compare") renderCompare();
  else renderTables();
}
function refresh(){ buildControls(); render(); }

/* ══ 초기화 ══════════════════════════════════════════════════ */
function init(){
  // 언제 받은 데이터인지 한눈에 보이게 — 생성일 자체보다 "며칠 전"이 빨리 읽힌다.
  var bits = [
    META.start.slice(0,4) + "." + META.start.slice(4) + " ~ " +
    META.end.slice(0,4) + "." + META.end.slice(4),
    "단지 " + C.length + "개"
  ];
  var lastDeal = latestDealYmd();
  if(lastDeal) bits.push("최신 거래 " + ymdLabel(lastDeal));
  var ago = daysAgo(META.generated);
  bits.push(agoLabel(ago) + (META.generated ? " (" + META.generated + ")" : ""));
  document.getElementById("metaLine").textContent = bits.join(" · ");

  // 갱신이 며칠 밀리면 눈에 띄게 알린다. 자동 수집이 멈춘 걸 모르고 보는 게 최악이다.
  var stale = document.getElementById("staleBadge");
  if(ago != null && ago >= STALE_DAYS){
    stale.textContent = "데이터가 " + ago + "일 전입니다 — 수집이 멈춘 듯합니다";
    stale.hidden = false;
  } else {
    stale.hidden = true;
  }

  var badge = document.getElementById("dataBadge");
  if(META.sample){ badge.className = "badge warn"; badge.textContent = "샘플 데이터 (실거래 아님)"; }
  else badge.textContent = "국토교통부 실거래가";

  // 기본 선택 없음 — 지도의 체크박스나 왼쪽 목록에서 담는다

  applyRangeKey("m36");
  buildControls(); syncYmInputs(); renderPicker(); setTab("map");

  ["startY","startM","endY","endM"].forEach(function(id){
    document.getElementById(id).addEventListener("change", function(){
      var p = readYmSels();
      if(!p) return;
      S.startYm = p[0];
      S.endYm = p[1];
      S.rangeKey = null;                 // 직접 고르면 칩 선택을 해제한다
      syncYmInputs(); refresh();         // 연도를 바꾸면 월 목록도 다시 만든다
    });
  });
  document.getElementById("resetYm").addEventListener("click", function(){
    applyRangeKey("m36"); syncYmInputs(); refresh();
  });
  document.getElementById("periodCustom").addEventListener("change", function(e){
    var v = (e.target.value || "").split(/[,\s]+/)
      .map(function(x){ return parseInt(x,10); })
      .filter(function(x){ return x > 0 && x <= 240; });
    if(v.length){
      S.periods = v.sort(function(a,b){return a-b;});
      S.sortKey = "tier"; S.sortDir = 1;
      refresh();
    }
  });
  document.getElementById("tblSearch").addEventListener("input", function(e){
    S.tblQuery = e.target.value.trim();
    if(S.tab === "table") renderTables();
  });
  document.getElementById("pickSearch").addEventListener("input", renderPicker);
  document.getElementById("clearSel").addEventListener("click", function(){
    S.sel = []; S.slot = {}; renderPicker(); render();
  });
  document.getElementById("csvBtn").addEventListener("click", downloadCsv);
  var tabs = document.querySelectorAll(".tabs button");
  for(var i=0;i<tabs.length;i++)
    tabs[i].addEventListener("click", function(e){ setTab(e.currentTarget.dataset.tab); });
  document.getElementById("dClose").addEventListener("click", closeDetail);
  document.getElementById("detailBd").addEventListener("click", closeDetail);
  document.getElementById("dAdd").addEventListener("click", function(){
    if(!DETAIL_ID) return;
    toggleSel(DETAIL_ID);
    document.getElementById("dAdd").textContent =
      (S.sel.indexOf(DETAIL_ID) >= 0) ? "비교에서 빼기" : "비교에 담기";
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeDetail();
  });

  var rt = null;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ if(S.tab !== "table" && S.tab !== "map") render(); }, 150);
  });
}
init();
}
</script>
